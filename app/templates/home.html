{% extends "base.html" %}
{% set auth_page = true %}
{% block title %}Home{% endblock %}
{% block content %}
<h1 class="auth-title">Leave a mark on the day.</h1>
<p class="auth-sub">Daymark keeps the things worth doing close at hand, from the first small task to the last satisfying check.</p>

<div class="auth-actions">
  <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-block">Open your notebook</a>
  <a href="{{ url_for('auth.register') }}" class="btn btn-soft btn-block">Start fresh</a>
</div>
{% endblock %}
