{% extends "base.html" %}
{% set auth_page = true %}
{% block title %}Register{% endblock %}
{% block content %}
<h1 class="auth-title">Create your account</h1>
<p class="auth-sub">Start organizing your tasks in seconds.</p>

{% if error %}
<div class="alert alert-over mb-4" role="alert">
  <svg class="icon" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#alert"/></svg>
  <p>{{ error }}</p>
</div>
{% endif %}

<form method="post" action="{{ url_for('auth.register') }}">
  <div class="auth-field">
    <label class="label" for="email">Email</label>
    <input class="input" id="email" name="email" type="email" required autofocus autocomplete="email">
  </div>
  <div class="auth-field">
    <label class="label" for="password">Password</label>
    <input class="input" id="password" name="password" type="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>

<p class="auth-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
